# Plan de preprocesado del Tema 1 (paso 3 de la descarga completa). BORRADOR: NO SE EJECUTA EN EL PASO 3.
#
# Qué es: el plan que el paso 4 (`04_preprocesado`) aplicará para construir una BASE CURADA APARTE a partir del
# crudo y de la lista aprobada (`config/lista_curada.yaml`, de B1). La base actual (`series/base_series.parquet`)
# y el crudo no se tocan nunca. Decisiones que recoge (docs/fase2/mercados_series/PLAN_DESCARGA.md): D2 y D4 del
# paso 2; E4 y E5 del paso 3.
#
# En el paso 3 este fichero solo se carga, se valida y se SIMULA (`python -m ingesta.mercados_series.preprocesado`:
# tablas/preprocesado_simulacion.csv, solo recuentos y días). El módulo `preprocesado.py` tiene las funciones puras
# que dan la fecha conservadora de cada fila; el paso 4 las usará tal cual.
#
# Qué series: las «queda» de config/lista_curada.yaml (B1), que es la fuente de verdad de la decisión, del aviso de
# fecha y del grupo conservador (preprocesado.asignar_series; un test comprueba que coinciden).
#
# Formato de las reglas (el de config/lags.yaml):
#   de retraso:    {lag, fin_periodo, habiles?, n_habiles?, tramos?}: fin del periodo de referencia + lag ("nM" fines
#                  de mes, "nD" días naturales, "nMmD" primero los meses), primer hábil de 'habiles' y nunca antes del
#                  n-ésimo hábil tras el fin (catalogo.fecha_publicacion_tramos). 'tramos' por FECHA DE REFERENCIA.
#   de publicador: {publicador, lag?, habiles?}: la fecha de decisión que da hoy el publicador de publicaciones.yaml
#                  (visibilidad.disponible_publicador, decisión 16:30 NY) más 'lag' en días naturales (fin_periodo:
#                  fecha) y llevada al primer hábil de 'habiles'.
# Fecha curada de cada fila, por capas y siempre con max (NUNCA anterior a la original):
#   1. reglas_conservadoras o tramo_no_fiable: max(actual, min(regla conservadora, X)); X = el primer vintage de las
#      filas con la nota «anterior a ALFRED: valor del primer vintage (X)» (ese valor es público en X con seguridad y
#      así no adelanta a los vintages reales posteriores);
#   2. h15_diario: + 7 días antes de 2005-06-28;
#   3. reconstruidas: las filas publicadas antes de publicado_desde pasan a publicado_desde.
# Las capas 1 y 2 solo tocan las filas fechadas por una regla (calendario, lag_fijo, fichero); nunca vintage_exacto ni
# cierre_mercado. Si la fecha cambia, disponible_utc pasa a nulo (solo se conoce el día), como en
# catalogo.aplicar_excepciones, y se anota en registro_cambios. Las derivadas se recalculan en el paso 4 con sus
# componentes curados (contrato.fecha_publicacion_derivada).
#
# Sin red: todas las fuentes citadas están en el repo (publicaciones.yaml, notas de lags.yaml, fichas en
# results/ingesta/mercados_series/fichas/*.json, README del tema y tablas del paso 2).

version: 1
estado: borrador

# 1. Reglas conservadoras de los «no medibles» (D2, E4) ----------------------------------------------------------
# Series con veredicto_desde_2000 = 'no medible' (inventario_series.csv) y las de reglas con menos de
# inventario.MIN_COMPARACIONES comparaciones (FF_MENSUAL y EUROSTAT_PARO, n = 1), como en el 02. Entran con aviso y con
# la fecha más tardía plausible según el calendario documentado de cada fuente. En el backtest se hace una prueba de
# robustez contra la fecha normal (D2).
reglas_conservadoras:
  mercado_diario:
    descripcion: 'Curvas y tipos de cambio de bancos centrales, €STR y OAS de ICE en FRED. Regla: si hoy la decisión ya es
      el día siguiente al dato, se añade un día de margen (hábil siguiente a esa decisión); si hoy es el mismo día, pasa
      al hábil siguiente. Mismo calendario de hábiles que el publicador (TARGET en el BCE y el Bundesbank; us_federal en
      el Tesoro y FRED; semana en el resto)'
    notas:
      - 'Riesgo pequeño y acotado (02_inventario: un día si un festivo o un retraso no está en el calendario); sin revisiones'
      - 'Festivos nacionales de Japón, Canadá, Reino Unido y Australia fuera del calendario semana: el cargador ya usa la
        siguiente fecha con dato; con max(actual, regla) esas filas no se adelantan'
    reglas:
      ecb_fx:
        actual: {publicador: ecb_fx, dia: mismo, hora: "16:00", huso: Europe/Berlin}
        conservadora: {publicador: ecb_fx, lag: "1D", habiles: target}
        fuente: 'publicaciones.yaml (ecb_fx: tipos de referencia hacia las 16:00 CET, días TARGET2); ficha bce (FX: mismo
          día 16:00 Berlín, visible en la decisión del día)'
        motivo: 'hoy visible el mismo día (16:00 Berlín = 10:00 NY); sin medir: pasa al hábil TARGET siguiente'
      ecb_estr:
        actual: {publicador: ecb_estr, dia: siguiente_habil, hora: "08:00", huso: Europe/Berlin, habiles: target}
        conservadora: {publicador: ecb_estr, lag: "1D", habiles: target}
        fuente: 'publicaciones.yaml (ecb_estr: el €STR de D a las 08:00 CET del hábil TARGET siguiente); ficha bce
          (retraso mediano 1 día)'
        motivo: 'hoy ya es día siguiente: un hábil TARGET de margen'
      ecb_tipos_oficiales:
        actual: {publicador: ecb_tipos_oficiales, dia: mismo, hora: "00:00", huso: Europe/Berlin}
        conservadora: {publicador: ecb_tipos_oficiales}
        fuente: 'publicaciones.yaml (ecb_tipos_oficiales: la fila es la fecha de efecto; la decisión se anuncia días antes);
          ficha bce (tipos oficiales visibles en su fecha de efecto)'
        motivo: 'igual que la actual: la fecha de efecto ya es la más tardía plausible (el tipo se anuncia antes de aplicarse)'
      ecb_yc:
        actual: {publicador: ecb_yc, dia: siguiente_habil, hora: "12:00", huso: Europe/Berlin, habiles: target}
        conservadora: {publicador: ecb_yc, lag: "1D", habiles: target}
        fuente: 'publicaciones.yaml (ecb_yc: Last-Modified 2026-10-13 12:00 Berlín con el dato del 12); ficha bce_curvas
          (mediana 1 día natural, máximo 6)'
        motivo: 'hoy ya es día siguiente: un hábil TARGET de margen'
      bundesbank_diario:
        actual: {publicador: bundesbank_diario, dia: siguiente_habil, hora: "12:00", huso: Europe/Berlin, habiles: target}
        conservadora: {publicador: bundesbank_diario, lag: "1D", habiles: target}
        fuente: 'publicaciones.yaml (bundesbank_diario: medido 2026-10-13, la curva de D aparece ya el día D; se usa D+1
          12:00, conservador)'
        motivo: 'hoy ya es día siguiente: un hábil TARGET de margen'
      treasury_curva:
        actual: {publicador: treasury_curva, dia: mismo, hora: "18:00", huso: America/New_York}
        conservadora: {publicador: treasury_curva, lag: "1D", habiles: us_federal}
        fuente: 'publicaciones.yaml (treasury_curva: fin de la tarde del mismo día, 18:00 NY > 16:30: el dato de t es
          visible en la decisión de t+1); ficha ust_curva (mediana 1 día, máximo 1)'
        motivo: 'hoy ya es día siguiente (18:00 NY): un hábil us_federal de margen; hora sin fuente oficial (README)'
      ice_bofa_fred:
        actual: {publicador: ice_bofa_fred, dia: siguiente_habil, hora: "09:15", huso: America/New_York, habiles: us_federal}
        conservadora: {publicador: ice_bofa_fred, lag: "1D", habiles: us_federal}
        fuente: 'publicaciones.yaml (ice_bofa_fred: last_updated 2026-10-09 09:08 NY con el dato del 08); ficha ice_bofa_oas
          (hábil siguiente hacia las 09:10 NY; ALFRED fecha la vintage antes de la carga real)'
        motivo: 'hoy ya es día siguiente: un hábil us_federal de margen'
      mof_jgb:
        actual: {publicador: mof_jgb, dia: siguiente_habil, hora: "08:30", huso: Asia/Tokyo, habiles: semana}
        conservadora: {publicador: mof_jgb, lag: "1D", habiles: semana}
        fuente: 'publicaciones.yaml (mof_jgb: Last-Modified 08:30 JST del hábil siguiente); ficha mof_jgb (mediana 1 día,
          máximo 11)'
        motivo: 'hoy ya es día siguiente: un hábil de margen'
      boj_diario:
        actual: {publicador: boj_diario, dia: siguiente_habil, hora: "12:00", huso: Asia/Tokyo, habiles: semana}
        conservadora: {lag: "1D", fin_periodo: fecha, habiles: semana, n_habiles: 3}
        fuente: 'publicaciones.yaml (boj_diario: la cifra definitiva del tipo call de D sale el hábil siguiente por la
          mañana); ficha boj (medido en la sonda: boj:FM01.STRDCLUCON iba 5 días naturales por detrás, con fin de
          semana y el festivo japonés del 12-oct)'
        motivo: 'la medida (5 días naturales) no cabe en el hábil siguiente: tercer hábil tras el dato (el jueves sale el
          martes), que cubre un festivo japonés fuera del calendario semana'
      boc_valet:
        actual: {publicador: boc_valet, dia: siguiente_habil, hora: "12:00", huso: America/Toronto, habiles: semana}
        conservadora: {publicador: boc_valet, lag: "1D", habiles: semana}
        fuente: 'publicaciones.yaml (boc_valet: conservador, hábil siguiente a las 12:00 de Toronto)'
        motivo: 'hoy ya es día siguiente: un hábil de margen'
      boc_bonos:
        actual: {publicador: boc_bonos, dia: siguiente_habil, hora: "18:00", huso: America/Toronto, habiles: semana}
        conservadora: {publicador: boc_bonos, lag: "1D", habiles: semana}
        fuente: 'publicaciones.yaml (boc_bonos: el 2026-10-13 a las 07:44 de Toronto el último dato era el del 8, festivo
          el 12)'
        motivo: 'hoy ya es día siguiente: un hábil de margen'
      boe_yc:
        actual: {publicador: boe_yc, dia: siguiente_habil, hora: "12:00", huso: Europe/London, habiles: semana}
        conservadora: {publicador: boe_yc, lag: "1D", habiles: semana}
        fuente: 'publicaciones.yaml (boe_yc: Last-Modified del zip 2026-10-13 11:04 Londres con el dato del 12)'
        motivo: 'hoy ya es día siguiente: un hábil de margen'
      rba_diario:
        actual: {publicador: rba_diario, dia: siguiente_habil, hora: "12:00", huso: Australia/Sydney, habiles: semana}
        conservadora: {lag: "7D", fin_periodo: fecha, habiles: semana}
        fuente: 'publicaciones.yaml (rba_diario: tablas F1/F2; conservador, hábil siguiente a las 12:00 de Sídney); ficha
          rba (medido en la sonda: la tabla F2, rba:FCMYGBAG10D, iba 6 días naturales por detrás; F1, 1 día)'
        motivo: 'la F2 se actualiza con hasta 6 días de retraso: 7 días naturales y primer hábil (la misma regla para
          las dos tablas del publicador)'
      RBA_F1:
        regla_de_lags: rba_diario
        series: ['rba:FIRMMCRTD']
        actual: {publicador: rba_diario, dia: siguiente_habil, hora: "12:00", huso: Australia/Sydney, habiles: semana}
        conservadora: {publicador: rba_diario, lag: "1D", habiles: semana}
        fuente: 'saneado P12 (2026-11-21): ficha rba (medido en la sonda: la tabla F1, rba:FIRMMCRTD, iba 1 día por detrás;
          la de 7 días es la de la F2, rba:FCMYGBAG10D); el tipo oficial del RBA se publica con la decisión del consejo'
        motivo: 'la F1 ya no hereda los 7 días de la F2: su regla actual + un hábil de margen, como boc_valet y boe_yc'


  banco_mundial:
    descripcion: 'Anuales del WDI (594 series en la base; 24 en el alcance estricto de D9). Regla: la siguiente
      actualización del WDI tras el fin del año: si un país no entra en la del año t+1, entra en la del t+2'
    notas:
      - 'La fecha no arregla la fuga de revisiones: los valores son los del último vintage (nota de revisable)'
    reglas:
      WB_ANUAL:
        actual: {lag: "12M", fin_periodo: anio}
        conservadora: {lag: "19M", fin_periodo: anio}
        fuente: 'lags.yaml (WB_ANUAL: el año t sale entre abril y julio de t+1); ficha worldbank (lastupdated 2026-10-08;
          2025 ya publicado para 186 países frente a 200 con 2024: unos 14 países llegan después de t+1)'
        motivo: 'fin de t+1 cubre el ciclo regular de abril a julio de t+1, pero no a los países que no entran en él;
          la siguiente actualización regular, la de abril a julio de t+2, da el 31 de julio de t+2 (19 fines de mes)'

  macro_eurostat_bce_bis:
    descripcion: 'Macro de Eurostat, BCE y BIS sin vintages: el retraso máximo de su calendario documentado más 7 días
      de margen (el mismo margen que el tramo no fiable)'
    notas:
      - 'Valores del último vintage (revisiones del PIB y del paro): la fecha no arregla la fuga de revisiones'
    reglas:
      EUROSTAT_PARO:
        actual:
          lag: "2M"
          fin_periodo: mes
          tramos:
            - {desde: '2012-01-01', lag: "1M10D", habiles: target}
        conservadora:
          lag: "2M7D"
          fin_periodo: mes
          tramos:
            - {desde: '2012-01-01', lag: "1M17D", habiles: target, verificado: false,
               fuente: 'lags.yaml EUROSTAT_PARO: noviembre, el mes más tardío, sale hacia t+40 (2014-01-08, 2019-01-09,
                 2024-01-09); + 7 días'}
        fuente: 'lags.yaml (EUROSTAT_PARO: muestras de notas de prensa archivadas de Eurostat; antes de 2012, noviembre de
          2009 salió el 2010-01-08); fiabilidad_c.csv (n = 1: cuenta como no medible)'
        motivo: 'retraso máximo documentado (t+40 en noviembre) + 7 días desde 2012; antes de 2012, fin de M+2 + 7 días'
      EUROSTAT_HICP:
        regla_de_lags: CPIAUCSL
        fuentes: [eurostat]
        actual: {lag: "1M1D", fin_periodo: mes}
        conservadora: {lag: "1M8D", fin_periodo: mes}
        fuente: 'ficha bce (HICP 4D0: retraso de la primera versión, mediana 46 días y máximo 49 desde el inicio del mes,
          es decir, hacia el día 18 de M+1); ficha eurostat (HICP 1M1D desde el fin de mes, Euro indicators a las 11:00)'
        motivo: 'antes, «no fiable» en toda la serie con la medida prestada del IPC de EE. UU. (regla CPIAUCSL); con el
          calendario de Eurostat la regla actual (día 1 de M+2) ya pasa del máximo medido: + 7 días de margen'
      EUROSTAT_ESI:
        regla_de_lags: UMCSENT
        fuentes: [eurostat]
        actual: {lag: "1D", fin_periodo: mes}
        conservadora: {lag: "8D", fin_periodo: mes}
        fuente: 'ficha eurostat (ESI 1D desde el fin de mes; ei_bssi_m_r2 actualizado el 2026-09-29 con septiembre:
          la encuesta sale a final de M)'
        motivo: 'antes, «no fiable» en toda la serie con la medida prestada de Michigan (UMCSENT); con el calendario de
          Eurostat (final de M) la regla actual + 7 días de margen'
      EUROSTAT_PARO_UK:
        actual: {lag: "3M", fin_periodo: mes}
        conservadora: {lag: "4M", fin_periodo: mes}
        fuente: 'lags.yaml (EUROSTAT_PARO_UK: LFS de la ONS a mediados de M+2 y Eurostat la incorporaba 1-2 meses más tarde)'
        motivo: 'el máximo documentado (mediados de M+2 + 2 meses = mediados de M+4) pasa del fin de M+3 actual: fin de
          M+4 (unas dos semanas de margen)'
      EUROSTAT_PIB:
        actual:
          lag: "2M10D"
          fin_periodo: trimestre
          tramos:
            - {desde: '2003-01-01', hasta: '2015-12-31', lag: "1M18D", habiles: target}
            - {desde: '2016-01-01', lag: "1M5D", habiles: target}
        conservadora:
          lag: "2M17D"
          fin_periodo: trimestre
          tramos:
            - {desde: '2003-01-01', hasta: '2015-12-31', lag: "1M22D", habiles: target, verificado: false,
               fuente: 'lags.yaml EUROSTAT_PIB: flash t+45 (2003-05-15, 2007-08-14, 2009-02-13, 2016-02-12); t+45 + 7'}
            - {desde: '2016-01-01', lag: "1M9D", habiles: target, verificado: false,
               fuente: 'lags.yaml EUROSTAT_PIB: flash preliminar t+30, el más tardío t+33 (2021-02-02); t+33 + 7'}
        fuente: 'lags.yaml (EUROSTAT_PIB: notas de prensa de Eurostat; antes de 2003 primera estimación hacia t+60-70, sin
          muestra); ficha eurostat'
        motivo: 'retraso máximo documentado de cada época + 7 días: t+78 antes de 2003, t+52 en 2003-2015 y t+40 desde 2016'
      EUROSTAT_PIB_PAISES:
        actual:
          lag: "2M10D"
          fin_periodo: trimestre
          tramos:
            - {desde: '2003-01-01', lag: "1M18D", habiles: target}
        conservadora:
          lag: "2M17D"
          fin_periodo: trimestre
          tramos:
            - {desde: '2003-01-01', lag: "1M22D", habiles: target, verificado: false,
               fuente: 'lags.yaml EUROSTAT_PIB_PAISES: el más lento de los cuatro institutos, t+45 (Destatis desde 2003,
                 ONS t+40/45 desde 2018); + 7 días'}
        fuente: 'lags.yaml (EUROSTAT_PIB_PAISES: calendarios nacionales de Destatis, INSEE, Istat y ONS resumidos, sin
          muestra archivada)'
        motivo: 'retraso máximo documentado (t+45) + 7 días desde 2003; antes, t+71 + 7'
      BIS_WS_CBPOL:
        actual: {lag: "7D", fin_periodo: mes}
        conservadora: {lag: "14D", fin_periodo: mes}
        fuente: 'lags.yaml (BIS_WS_CBPOL: el tipo se conoce el día de la decisión; el BIS lo recopila con días de retraso);
          ficha bis (por_flujo.WS_CBPOL: retraso observado mínimo 13 días)'
        motivo: 'sin calendario del BIS: la regla actual + 7 días de margen, que cubre los 13 días observados'
      BIS_WS_CREDIT_GAP:
        actual: {lag: "6M", fin_periodo: trimestre}
        conservadora: {lag: "6M7D", fin_periodo: trimestre}
        fuente: 'lags.yaml (BIS_WS_CREDIT_GAP: publicación trimestral del BIS con 3-6 meses de retraso); ficha bis
          (retraso observado mínimo 196 días)'
        motivo: 'retraso máximo documentado (6 meses) + 7 días'
        notas:
          - 'F2: retraso medido de unos 5,5 meses tras el fin del trimestre (la publicación del 2026-09-14 trae 2026-Q1);
            6M7D lo cubre (2026-Q1 visible el 2026-10-07; test). Confianza media: una sola publicación comprobada'
          - 'Publicado desde 2016-09-18 (https://www.bis.org/publ/qtrpdf/r_qt1609c.htm): reconstruidas.externas'
      BIS_WS_DSR:
        actual: {lag: "6M", fin_periodo: trimestre}
        conservadora: {lag: "6M7D", fin_periodo: trimestre}
        fuente: 'lags.yaml (BIS_WS_DSR: se publica con el crédito total, 3-6 meses); ficha bis (retraso observado mínimo
          196 días)'
        motivo: 'retraso máximo documentado (6 meses) + 7 días'
        notas:
          - 'F2: retraso medido de unos 5,5 meses tras el fin del trimestre (la publicación del 2026-09-14 trae 2026-Q1);
            6M7D lo cubre (2026-Q1 visible el 2026-10-07; test). Confianza media: una sola publicación comprobada'
          - 'Publicado desde 2015-09-13 (https://www.bis.org/press/p150913.htm): reconstruidas.externas'
      BIS_WS_EER:
        actual: {lag: "1M", fin_periodo: mes}
        conservadora: {lag: "1M7D", fin_periodo: mes}
        fuente: 'lags.yaml (BIS_WS_EER: publicación mensual hacia mediados del mes siguiente); ficha bis (retraso observado
          mínimo 43 días)'
        motivo: 'retraso máximo documentado (fin del mes siguiente) + 7 días'

  academicas:
    descripcion: 'Ficheros académicos y espejos (Ken French, Shiller, Goyal-Welch, OFR FSI y datahub): la cadencia de
      actualización documentada más un margen (una edición saltada en las de cadencia mensual)'
    notas:
      - 'Solo se mueven las filas fechadas por la regla: las de ediciones archivadas posteriores ya llevan su fecha real,
        más tardía, y max(actual, regla) no las cambia'
      - 'Ken French, OFR FSI y Goyal-Welch se reconstruyen hacia atrás: además de la regla, publicado_desde en
        reconstruidas.externas (F1 y F2, fechas comprobadas en la web)'
    reglas:
      FF_MENSUAL:
        actual: {lag: "45D", fin_periodo: mes}
        conservadora:
          segmentos:
            - hasta: '2005-08-31'
              regla: {lag: "12M7D", fin_periodo: anio}
            - desde: '2005-09-01'
              regla: {lag: "2M7D", fin_periodo: mes}
        fuente: 'F1, verificado en la Wayback Machine (2026-11-19):
          https://web.archive.org/web/20011218003540/http://mba.tuck.dartmouth.edu/pages/faculty/ken.french/data_library.html
          y las capturas posteriores (la página decía «updated at least once a year» y no hay zips archivados antes de
          2005); archivo anual de factores desde 2005:
          https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/Data_Library/f-f_factors_archive.html; ficha
          ken_french y fiabilidad_c.csv (n = 1, +19 días)'
        motivo: 'por periodo de referencia: antes de 2005-09, cadencia anual (fin del año + 12 meses + 7 días: el dato de
          un mes de t se ve a primeros de enero de t+2); desde 2005-09, mensual, medida a 17-30 días del fin de mes y a
          veces más de 45 (en 2006 septiembre aún no estaba el 17 de noviembre; en 2025, 42 días): 2M7D cubre ese máximo'
        notas:
          - 'French reconstruye TODA la historia en cada actualización (revisiones): los valores son los de la edición
            descargada, no los de su fecha (archivo anual desde 2005 en f-f_factors_archive.html)'
          - 'publicado_desde por fichero en reconstruidas.externas (F3M 2001-12-18, F3D 2002-06-04, F5M 2014-12-19, F5D
            2015-06-01)'
      GW_ANUAL:
        actual: {lag: "7M1D", fin_periodo: anio}
        conservadora:
          lag: "13M"
          fin_periodo: anio
          tramos:
            - {desde: '2022-01-01', hasta: '2022-12-31', lag: "15M15D", verificado: true,
               fuente: 'Wayback Machine (2026-11-19): la web pasa de «hasta 2021» a «hasta 2023» entre 2023-03-25 y
                 2024-04-15; los datos de 2022 nunca salieron sueltos: visibles el 2024-04-15'}
        fuente: 'F2, verificado en la Wayback Machine (2026-11-19):
          https://web.archive.org/web/20040413082023/http://www.bus.emory.edu:80/AGoyal/ y capturas posteriores (datos
          hasta 2009 guardados el 2010-11-10; los de 2011 enlazados entre febrero y diciembre de 2012); lags.yaml y
          ficha goyal_welch'
        motivo: 'la edición anual sale entre abril y noviembre de t+1 y a veces más tarde: 13 fines de mes tras el fin
