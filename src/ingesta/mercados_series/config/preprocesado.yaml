# 3. H.15 diario antes de 2005-06-28 ----------------------------------------------------------------------------------
h15_diario:
  descripcion: 'series diarias del publicador fed_h15 (catálogo): + 7 días en las filas por calendario publicadas antes
    de 2005-06-28'
  publicador: fed_h15
  hasta: '2005-06-28'
  conservadora: {publicador: fed_h15, lag: "7D"}
  fuente: 'README del tema (deudas, riesgo medio: el archivo de la Fed solo guarda la edición semanal de H.15 antes de
    2005-06-28; si la web no publicaba el dato diario, DGS*, DTB*, DFF y demás se ven hasta una semana antes)'
  notas:
    - 'Una semana: lo que tarda la edición semanal. Sin muestra archivada'

# 4. Índices reconstruidos hacia atrás --------------------------------------------------------------------------------
# Un índice creado en publicado_desde no existía antes: sus filas anteriores, aunque la regla las dé por visibles,
# pasan a publicado_desde (catalogo.anotar_reconstruidas solo anota NOTA_RECONSTRUIDA; aquí se aplica a la fecha).
reconstruidas:
  descripcion: 'fecha curada = max(curada, publicado_desde) en las filas publicadas antes de publicado_desde: antes de
    esa fecha no se ve nada'
  fuente: 'series: config/catalogo_series.yaml (publicado_desde, primera vintage de ALFRED; catalogo.anotar_reconstruidas y
    NOTA_RECONSTRUIDA); un test comprueba que coincide con el catálogo'
