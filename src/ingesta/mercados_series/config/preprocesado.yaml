        (primera captura con el fichero; en la anterior, http://web.archive.org/web/20050606003547/http://mba.tuck.dartmouth.edu/pages/faculty/ken.french/data_library.html,
        aún no está). https://web.archive.org/web/20011218003540/http://mba.tuck.dartmouth.edu/pages/faculty/ken.french/data_library.html
        es la primera captura de la biblioteca'
      nota: 'F-F_Momentum_Factor_daily y 5_Industry_Portfolios_daily aparecen a la vez entre 2005-06-06 y 2005-07-26: se
        toma 2005-07-26 (conservador)'
  notas:
    - 'fred:STLFSI4: publicado_desde 2022-11-10 (versión 4 del índice): las filas anteriores son la metodología nueva
      recalculada hacia atrás'

# 5. Proyecciones (D4) ------------------------------------------------------------------------------------------------
proyecciones:
  descripcion: 'Las proyecciones van a una tabla aparte, fuera de la base curada: no son datos de su fecha de referencia'
  destino: 'series/proyecciones.parquet (en el corpus del paso 4, junto a la base curada)'
  columnas: [serie, fecha_referencia, fecha_publicacion, disponible_utc, vintage, valor, unidad, divisa, fuente,
             metodo_publicacion, nota, horizonte, edicion]
  identificacion:
    regla: 'inventario.es_proyeccion (columna es_proyeccion de inventario_series.csv): proyecciones: conservar en el
      catálogo, «.PROY.» en el id o fecha_referencia posterior al vintage en al menos la mitad de las filas'
    weo: 'imf:WEO.<país>.<concepto>.PROY.H<h>: estimación del año en curso y horizontes a 1-5 años; horizonte = h del id;
      edicion = vintage (AAAA-MM de la edición del WEO)'
    sep: 'fred:FEDTARMD, fred:PCECTPIMD y fred:UNRATEMD (SEP del FOMC, vintage_exacto de ALFRED); horizonte = año de
      fecha_referencia - año del vintage; edicion = vintage (fecha de la reunión)'
    funcion: 'preprocesado.separar_proyecciones (reparte filas; no cambia ninguna)'
  # 3b-2: + 66 del WEO (11 conceptos de los agregados 001, 163 y 200 × 6 horizontes); antes 240 + 3 = 243.
  # Saneado P16 (2026-11-21): el WEO sale de la curada (sin ediciones antes de 2025-04): solo quedan las 3 del SEP.
  esperadas: {imf_weo: 0, fred_alfred: 3, total: 3}
  notas:
    - 'Las fechas de las proyecciones no cambian: son exactas (vintage del WEO o de ALFRED)'

# 6. Homogeneización (solo lo que hace falta de verdad) -----------------------------------------------------------------
homogeneizacion:
  unidades_equivalentes:   # mismo significado con nombres distintos (inventario_series.csv): se deja el canónico
    - {unidades: ['% de la población activa', '% población activa'], canonica: '% de la población activa',
       motivo: 'paro de FRED, WEO, OCDE y Banco Mundial frente a BCE y Eurostat (9 series)'}
    - {unidades: ['% (variación interanual)', '% interanual'], canonica: '% (variación interanual)',
       motivo: 'IPC de Atlanta y Dallas frente a HICP, PIB y paro del BCE y Eurostat (36 series)'}
    - {unidades: ['USD por índice', 'USD por índice (anualizado)'], canonica: 'USD por índice (anualizado)',
       motivo: 'dividendos y beneficios de 12 meses de Goyal-Welch (D12, E12) frente a los anualizados de Shiller (D, E)'}
  no_equivalentes:   # parecen iguales y no lo son: no se tocan
    - {unidades: ['% anual (base descuento)', '% anual'], motivo: 'letras del Tesoro en base descuento (DTB*, TB3MS, ^IRX)
       frente al rendimiento equivalente de bono: otra convención'}
    - {unidades: ['% anual (fin de mes)', '% anual'], motivo: 'tipo oficial del BIS a fin de mes frente a medias o diarios'}
    - {unidades: ['% de la renta disponible', '% de la renta personal disponible'], motivo: 'servicio de la deuda (BIS)
       frente a tasa de ahorro (PSAVERT): conceptos distintos'}
    - {unidades: ['<X> por 1 EUR', 'USD por 1 <X>', '<X> por 1 USD'], motivo: 'cotizaciones de divisas: se guardan tal cual
       y divisas.py convierte a USD al leer (USD base, decisión de la sonda)'}
  escalas:   # tanto por uno → porcentaje (solo series que se quedan; las de alias no se escalan)
    - {unidad: 'tanto por uno anual', factor: 100, unidad_nueva: '% anual',
       series: [gw:M.lty, gw:M.tbl],
       motivo: 'tipos de Goyal-Welch frente a AAA, BAA, GS10 y TB3MS de FRED en % anual (gw:M.tbl, historia previa de
         fred:TB3MS desde el saneado P24)'}
    - {unidad: 'tanto por uno mensual', factor: 100, unidad_nueva: '% mensual',
       series: [gw:M.CRSP_SPvw, gw:M.CRSP_SPvwx, gw:M.Rfree, gw:M.corpr, gw:M.infl, gw:M.ltr],
       motivo: 'rentabilidades de Goyal-Welch frente a las de Ken French en %'}
    - {unidad: 'tanto por uno anualizado', factor: 100, unidad_nueva: '% anualizado',
       series: [deriv:VOLREAL21_GSPC],
       motivo: 'volatilidad realizada frente al VIX y demás volatilidades implícitas en %'}
  sin_escalar:
    - {unidades: ['tanto por uno', 'tanto por uno al cuadrado (mensual)'], series: ['gw:M.ntis', 'gw:M.svar'],
       motivo: 'ratios y varianza sin equivalente en %: se dejan como están'}
  frecuencias:
    remuestrear: false
    motivo: 'frecuencias nativas (decisión del paso 4 en PLAN_DESCARGA.md): ni se agregan ni se rellenan'
  alias:
    donde: 'tabla de alias aparte (series/alias.parquet del paso 4), NO en la base curada'
    nota: 'los alias y canónicos los decide B1 en config/lista_curada.yaml; aquí solo cómo se marcan: la base curada
      solo lleva el canónico y la tabla de alias guarda {alias, canonico, motivo, correlacion} sin valores'
  notas:
    - 'Una escala cambia valores: va al registro de cambios con la unidad antes y después (no los valores)'
    - 'unidad_por_vintage del catálogo (año base o dólares encadenados de cada vintage) no se homogeneiza: es la unidad
      de cada vintage'

# 7. Escalas por vintage (×1000 o ×0,001 entre vintages de ALFRED) -----------------------------------------------------------
escalas_por_vintage:
  descripcion: 'los vintages anteriores a antes_de_vintage se multiplican por factor para llevarlos a la unidad vigente
    (la del catálogo); el valor no cambia de significado, solo de escala'
  fuente: 'results/ingesta/mercados_series/tablas/eda_series_incidencias.csv (tipo cambio_unidad, de B2)'
  criterio: 'log10 del factor entero = ±3, al menos 20 fechas comunes, sin declarar en el catálogo (unidad_por_vintage)
    y serie que se queda (preprocesado.propuesta_escalas_vintage; los tests comprueban que coincide)'
  series:
    - {serie: 'fred:BCNSDODNS', antes_de_vintage: '2026-01-09', factor: 1000.0, comunes: 301}
    - {serie: 'fred:BOGMBASE', antes_de_vintage: '2024-09-24', factor: 0.001, comunes: 787}
    - {serie: 'fred:CMDEBT', antes_de_vintage: '2026-01-09', factor: 1000.0, comunes: 301}
    - {serie: 'fred:REVOLSL', antes_de_vintage: '2025-02-07', factor: 1000.0, comunes: 683}
    - {serie: 'fred:TNWBSHNO', antes_de_vintage: '2026-01-09', factor: 1000.0, comunes: 301}
    - {serie: 'fred:TOTALSL', antes_de_vintage: '2025-02-07', factor: 1000.0, comunes: 983}
  notas:
    - 'Los demás cambio_unidad del EDA (GDPNOW, FEDTARMD, RECPROUSM156N con 1-2 fechas comunes; CBIC1 declarado en el
      catálogo) no se escalan: revisar a mano'

# 8. Incidencias del EDA (E7): generada desde eda.PROPUESTAS y eda.NOTAS (B2) --------------------------------------------
incidencias_eda:
  fuente: 'ingesta.mercados_series.eda.PROPUESTAS (acción) y eda.NOTAS (nota); un test comprueba que no falta ni sobra
    ningún tipo'
  tipos:
    hueco_largo: {accion: marcar, nota: 'periodos seguidos sin dato (frecuencia del catálogo; diarias en días L-V)'}
    salto: {accion: revisar a mano, nota: 'cambio a más de 8 desviaciones robustas de los cambios de la serie'}
    ruptura_nivel: {accion: revisar a mano, nota: 'salto de la mediana móvil (antes frente a después)'}
    cambio_unidad: {accion: revisar a mano, nota: 'cambio de escala entre vintages consecutivos (log10 del factor)'}
    pct_parece_tanto_por_uno: {accion: revisar a mano, nota: 'unidad en %, pero todos los valores en [-1, 1]'}
    tanto_por_uno_parece_pct: {accion: revisar a mano, nota: 'unidad en tanto por uno, pero mediana de |valor| > 1'}
    negativo_en_nivel: {accion: nulo + aviso, nota: 'valores <= 0 en una serie de nivel que debe ser positiva'}
    racha_plana: {accion: marcar, nota: 'posible dato congelado de la fuente: racha plana de 120 o más observaciones seguidas'}
    fin_de_semana: {accion: marcar, nota: 'posible error de fecha de la fuente: cierre de mercado en fin de semana'}
    festivo: {accion: marcar, nota: 'posible error de fecha de la fuente: cierre de mercado en festivo'}
    salto_sin_split: {accion: revisar a mano, nota: '|Δlog close| > 0,4 sin split ni dividendo esa sesión ni la siguiente'}
    contrasplit: {accion: marcar, nota: 'split < 1 (contrasplit)'}
    split_fraccionario: {accion: marcar, nota: 'split > 1 no entero que no explica el precio: |log(close_t·split/close_t-1)| > 0,2'}
    volumen_cero: {accion: marcar, nota: 'calidad.incidencias_precios: volumen 0 en instrumento con volumen'}
    cierre_repetido: {accion: marcar, nota: 'calidad.incidencias_precios: cierre igual al de la sesión previa'}
    dividendo_alto: {accion: revisar a mano, nota: 'calidad.incidencias_precios: dividendo > 20 % del cierre previo'}
    apertura_igual_cierre: {accion: nulo + aviso, nota: 'open == close y high == low: relleno de Yahoo; no vale como apertura de t+1'}
    sesion_faltante: {accion: marcar, nota: 'día hábil del calendario del mercado sin vela'}
    sesion_fuera_calendario: {accion: revisar a mano, nota: 'vela en un día que el calendario del mercado da cerrado (con movimiento o volumen)'}
    sesion_fuera_calendario_relleno: {accion: nulo + aviso, nota: 'vela de relleno en día cerrado: repite el cierre y no tiene volumen'}
    serie_sospechosa: {accion: marcar, nota: 'historial roto: muchos saltos sin split, cierres repetidos o aperturas de relleno'}

# 9. Salidas del paso 4 y verificaciones ------------------------------------------------------------------------------
salidas_paso4:
  ficheros:
    - {ruta: 'series/base_curada.parquet', contenido: 'base curada (mismo contrato que base_series.parquet): solo las
       series «queda» de lista_curada.yaml, con las fechas de este plan y sin proyecciones'}
    - {ruta: 'series/alias.parquet', contenido: 'tabla de alias: alias, canónico, motivo y correlación (sin valores)'}
    - {ruta: 'series/proyecciones.parquet', contenido: 'tabla de proyecciones (sección proyecciones)'}
    - {ruta: 'series/registro_cambios.parquet', contenido: 'una fila por fila curada con fecha cambiada: serie,
       fecha_referencia, vintage, fecha_publicacion y disponible_utc antes y después, capa (sección, grupo y regla,
       h15_diario o reconstruidas) y si la paró el tope del primer vintage; también los cambios de unidad por escala'}
  verificaciones:
    - 'ninguna fecha_publicacion curada anterior a la original (registro_cambios: después >= antes en todas las filas)'
    - 'disponible_utc coherente con fecha_publicacion: nulo o con primera decisión igual a la fecha curada
      (contrato._coherencia_disponible); la simulación lo cuenta (filas_disponible_incoherente = 0)'
    - 'el orden de vintages se mantiene: en cada serie y fecha_referencia, ordenadas por la fecha original, la curada no
      baja (filas_orden_roto = 0)'
    - 'el truncado se mantiene (TimeGate): ninguna fila visible antes de su fecha_publicacion curada; fecha_publicacion >=
      fecha_referencia (contrato.validar_series)'
    - 'los recuentos cuadran con lista_curada.yaml: series «queda» = series de la base curada; alias = filas de la
      tabla de alias; proyecciones = 309 series (proyecciones.esperadas)'
    - 'las filas exactas (vintage_exacto, cierre_mercado) y las posteriores al corte no cambian por las capas 1 y 2'
    - 'las derivadas se recalculan con sus componentes curados (fecha = la máxima de los componentes)'
    - 'la simulación del paso 3 (tablas/preprocesado_simulacion.csv) y el registro de cambios dan los mismos recuentos'
