# 2. Tramo no fiable (E5) y «fiable con margen» que adelanta --------------------------------------------------------
# Las series que se quedan con veredicto_desde_2000 = 'no fiable' NO se borran: antes de su corte
# (tramo_conservador_antes_de de lista_curada.yaml = fiable_desde; 'toda' = toda la serie, sin corte) su regla pasa a
# ser la actual + el adelanto máximo medido DE ESA SERIE + margen_dias. Las «fiable con margen» que adelantan antes de su
# fiable_desde entran igual, con el techo del adelanto y sin margen. Desde el corte nada cambia.
# Adelanto por serie (preprocesado.adelantos_por_serie; los tests comprueban que esta lista sale de las tablas):
#   alfred_previa: regla previa frente a la primera vintage de ALFRED, periodo a periodo (alfred_vs_lag.csv);
#   excepciones:   regla contrastada con ALFRED: excepción medida - regla en cada periodo de
#                  config/excepciones_publicacion.csv, sin los periodos de episodios_excluidos (ya corregidos por la
#                  excepción y que no se repiten: Moody's fuera de FRED);
#   regla:         sin datos por serie: el adelanto_max_dias de la regla en fiabilidad_c.csv (la tabla no guarda el
#                  p99; el máximo es más conservador).
# Salen del tramo y pasan a no medibles en su grupo: las de menos de inventario.MIN_COMPARACIONES comparaciones con un
# grupo para su regla (fred:LIOR3M) y las de Eurostat con 'toda' (HICP empalmado y ESI: EUROSTAT_HICP y EUROSTAT_ESI,
# con el calendario de Eurostat en vez de la medida prestada de EE. UU.).
