# Descripciones a mano de las series clave (y de unos pocos precios): qué mide, unidad y para qué sirve.
descripciones:
  fred:VIXCLS: VIX, volatilidad implícita a 30 días del S&P 500 que descuentan sus opciones, en puntos (equivale a % anualizado; diario). Es el «índice del miedo» y por encima de 30 suele señalar estrés en los mercados.
  fred:DGS10: Rendimiento del bono del Tesoro de EE. UU. a 10 años, en % anual (diario, H.15). Es el tipo de referencia a largo plazo y resume las expectativas de tipos, de inflación y la prima por plazo.
  fred:DGS2: Rendimiento del Tesoro de EE. UU. a 2 años, en % anual (diario, H.15). Es muy sensible a lo que el mercado espera de la Fed en los dos años siguientes.
  fred:DGS3MO: Rendimiento del Tesoro de EE. UU. a 3 meses, en % anual (diario, H.15). Aproxima el tipo libre de riesgo a corto plazo en dólares.
  fred:DGS30: Rendimiento del Tesoro de EE. UU. a 30 años, en % anual (diario, H.15). Es el tramo más largo de la curva y refleja la prima por plazo y la inflación a muy largo plazo.
  fred:T10Y2Y: Pendiente de la curva de EE. UU., rendimiento a 10 años menos el de 2 años, en puntos porcentuales (diario). Cuando es negativa (curva invertida) ha anticipado muchas recesiones.
  fred:T10Y3M: Pendiente de la curva de EE. UU., 10 años menos 3 meses, en puntos porcentuales (diario). Es la medida de inversión de la curva del modelo de probabilidad de recesión de la Fed de Nueva York.
  fred:FEDFUNDS: Tipo efectivo de los fondos federales, media mensual en % anual. Sigue de cerca al objetivo que fija la Reserva Federal y marca el tono de la política monetaria de EE. UU.
  fred:EFFR: Tipo efectivo de los fondos federales de cada día hábil (Fed de Nueva York), en % anual. Sigue al día el tipo oficial de la Fed.
  fred:SOFR: SOFR, tipo a un día de las operaciones repo garantizadas con bonos del Tesoro, en % anual (diario, desde 2018). Es la referencia elegida para sustituir al LIBOR en dólares.
  fred:CPIAUCSL: Índice de precios de consumo de EE. UU. (todos los artículos, desestacionalizado), base 1982-84 = 100, mensual. Su variación interanual es la inflación general (IPC).
  fred:CPILFESL: IPC subyacente de EE. UU. (sin alimentos ni energía), base 1982-84 = 100, mensual. Muestra la tendencia de fondo de la inflación sin lo más volátil.
  fred:PCEPI: Índice de precios del gasto en consumo personal (PCE) de EE. UU., base 2017 = 100, mensual. Es la medida de inflación preferida por la Reserva Federal.
  fred:PCEPILFE: PCE subyacente de EE. UU. (sin alimentos ni energía), base 2017 = 100, mensual. Es la medida de inflación que más mira la Fed para decidir los tipos.
  fred:UNRATE: Tasa de paro de EE. UU., en % de la población activa (mensual, desestacionalizada). Es el indicador clave del mercado laboral y del ciclo.
  fred:PAYEMS: Empleo no agrícola de EE. UU. (nóminas), en miles de personas (mensual, desestacionalizado). Su variación mensual es el dato de empleo que más mueve a los mercados.
  fred:ICSA: Peticiones iniciales de subsidio de paro en EE. UU., número semanal desestacionalizado. Es el dato de empleo más rápido y una subida sostenida avisa de deterioro.
  fred:NFCI: Índice nacional de condiciones financieras de la Fed de Chicago, en desviaciones típicas (semanal). Por encima de 0 las condiciones son más tensas que la media y por debajo más holgadas.
  fred:STLFSI4: Índice de estrés financiero de la Fed de St. Louis (versión 4), 0 = normal (semanal). Valores positivos indican más estrés que la media.
  fred:BAMLH0A0HYM2: Diferencial (OAS) de los bonos corporativos high yield de EE. UU. frente al Tesoro, en puntos porcentuales (diario, ICE BofA). Mide la prima por riesgo de impago y se dispara en las crisis.
  fred:BAMLC0A0CM: Diferencial (OAS) de los bonos corporativos con grado de inversión de EE. UU. frente al Tesoro, en puntos porcentuales (diario, ICE BofA). Es el termómetro del riesgo de crédito de las empresas de más calidad.
  deriv:DBAA-DGS10: Diferencial entre los bonos corporativos Baa de Moody's y el Tesoro a 10 años, en puntos porcentuales (diario, cálculo propio). Mide el riesgo de crédito corporativo con una historia mucho más larga que las OAS.
  yf:^GSPC: Índice S&P 500 (solo precio, sin dividendos), en puntos (diario). Es la referencia de la bolsa de EE. UU. y de la renta variable mundial.
  yf:^SP500TR: S&P 500 con los dividendos reinvertidos (total return), en puntos (diario). Sirve para medir la rentabilidad total de la bolsa de EE. UU.
  yf:^MOVE: Índice MOVE, volatilidad implícita a un mes de los bonos del Tesoro de EE. UU., en puntos básicos (diario). Es el «VIX de los bonos» y sube cuando hay incertidumbre sobre los tipos.
  ecb:EXR.D.USD.EUR: Tipo de cambio de referencia del BCE, dólares por euro (EURUSD), diario. Es la referencia para convertir entre euros y dólares.
  fred:DEXUSEU: Dólares por euro al mediodía de Nueva York (H.10 de la Fed), diario. Es la alternativa americana al EURUSD del BCE.
  fred:DTWEXBGS: Índice nominal amplio del dólar frente a las divisas de sus socios comerciales (Fed, enero de 2006 = 100, diario). Sube cuando el dólar se aprecia.
  yf:DX-Y.NYB: Índice dólar DXY de ICE, el dólar frente a una cesta de seis divisas dominada por el euro, en puntos (diario). Es la medida rápida y más seguida de la fuerza del dólar.
  ecb:HICP.M.U2.N.000000.4D0.ANR: Inflación general de la zona euro (HICP), tasa interanual en % (mensual, con la composición de cada fecha). El BCE fija su objetivo del 2 % sobre esta medida.
  ecb:HICP.M.U2.N.XEF000.4D0.ANR: Inflación subyacente de la zona euro (HICP sin energía, alimentos, alcohol ni tabaco), tasa interanual en % (mensual). Muestra la tendencia de fondo de los precios en el euro.
  ecb:DFR: Tipo de la facilidad de depósito del BCE, en % anual (con su fecha de efecto). Con exceso de liquidez en el sistema es el tipo oficial que guía el corto plazo del euro.
  ecb:MRO: Tipo de las operaciones principales de financiación del BCE, en % anual (con su fecha de efecto). Fue el tipo de referencia del euro cuando no sobraba liquidez.
  ecb:ESTR: €STR, tipo a un día sin garantía del mercado monetario del euro, en % anual (diario, desde 2019). Sustituye al EONIA como referencia del corto plazo en euros.
  ecb:YC.AAA.10Y: Tipo al contado a 10 años de la curva de bonos AAA de la zona euro (BCE, modelo Svensson), en % anual (diario). Es la referencia del tipo largo sin riesgo en euros, cercana al Bund alemán.
  ecb:LFSI.M.U2.S.UNEHRT.TOTAL0.15_74.T: Tasa de paro de la zona euro (15-74 años), en % de la población activa (mensual, desestacionalizada, composición de cada fecha). Es el indicador clave del mercado laboral del euro.
  eurostat:namq_10_gdp.Q.CLV_PCH_SM.SCA.B1GQ.EA: Crecimiento interanual del PIB real de la zona euro (Eurostat), en % (trimestral, desestacionalizado). Mide el ciclo económico del área del euro.
  ff:F3D.Mkt-RF: Factor mercado de Fama-French, rentabilidad diaria de la bolsa de EE. UU. menos el tipo libre de riesgo, en %. Es la prima de riesgo de la renta variable día a día.
  ff:F3D.SMB: Factor tamaño (SMB) de Fama-French, rentabilidad diaria de las empresas pequeñas menos las grandes, en %. Indica si las de baja capitalización lo hacen mejor que las grandes.
  ff:F3D.HML: Factor valor (HML) de Fama-French, rentabilidad diaria de las empresas baratas (valor contable alto) menos las caras, en %. Mide si el estilo valor gana al de crecimiento.
  ff:MOMD.Mom: Factor momentum de Ken French, rentabilidad diaria de las acciones que más han subido en el último año menos las que más han bajado, en %. Mide la tendencia a seguir lo que ya subió.
  shiller:CAPE: CAPE de Shiller, precio real del S&P 500 entre la media de 10 años de los beneficios reales (ratio, mensual). Valores altos indican una bolsa cara y rentabilidades a largo plazo más bajas.
  fred:T10YIE: Inflación implícita a 10 años (breakeven), Tesoro nominal a 10 años menos el TIPS a 10 años, en % anual (diario). Es la inflación media que descuenta el mercado.
  fred:T5YIFR: Inflación esperada a 5 años dentro de 5 años (5y5y), en % anual (diario). Sirve para saber si las expectativas de inflación a largo plazo siguen ancladas.
  fred:DFII10: Rendimiento real del bono ligado a la inflación (TIPS) a 10 años, en % anual (diario). Es el tipo de interés real; cuando sube endurece las condiciones financieras.
  fred:GDPC1: PIB real de EE. UU., en miles de millones de dólares encadenados de 2017 (tasa anual, trimestral). Mide el tamaño de la economía descontando la inflación.
  fred:A191RL1Q225SBEA: Crecimiento del PIB real de EE. UU., variación trimestral anualizada en %. Es el titular del dato de PIB; dos trimestres negativos se asocian a una recesión.
  fred:INDPRO: Índice de producción industrial de EE. UU. (2017 = 100, mensual). Indicador coincidente del ciclo que cubre industria, minería y suministros.
  fred:SAHMREALTIME: Regla de Sahm en tiempo real, en puntos porcentuales (mensual). Si la media de 3 meses del paro sube 0,5 puntos sobre su mínimo de 12 meses, suele indicar que ya ha empezado una recesión.
  fred:USRECD: Indicador diario de recesión del NBER (1 = recesión, 0 = expansión). El NBER fecha las recesiones con muchos meses de retraso, así que hay que usarlo con cuidado en tiempo real.
  fred:WTISPLC: Precio al contado del petróleo WTI, media mensual en dólares por barril. Es la referencia del precio de la energía y mueve una parte de la inflación.
  yf:GC=F: Futuro continuo del oro en COMEX, en dólares por onza troy (diario). Activo refugio que suele subir con tipos reales bajos o en momentos de miedo.
  ofr:FSI: Índice de estrés financiero de la OFR (diario; 0 = estrés medio). Resume crédito, bolsa, financiación, tipos y volatilidad en un solo número.
  fred:UMCSENT: Confianza del consumidor de la Universidad de Michigan (índice, primer trimestre de 1966 = 100, mensual). Anticipa el gasto de los hogares.
  fred:WALCL: Activos totales de la Reserva Federal (H.4.1), en millones de dólares (semanal). Mide el tamaño del balance de la Fed, que sube con las compras de bonos (QE) y baja con su reducción (QT).
  fred:M2SL: Masa monetaria M2 de EE. UU. (H.6), en miles de millones de dólares (mensual, desestacionalizada). Mide el dinero en manos del público (efectivo, depósitos y fondos del mercado monetario).
  fred:FEDTARMD: Proyección mediana del FOMC (SEP) para el tipo de los fondos federales a final de cada año, en % anual. Indica la senda de tipos que esperan los miembros de la Fed.
  fred:UNRATEMD: Proyección mediana del FOMC (SEP) para la tasa de paro de EE. UU., en % de la población activa (por año). Muestra cómo ve la Fed el mercado laboral.
  fred:PCECTPIMD: Proyección mediana del FOMC (SEP) para la inflación PCE (cuarto trimestre sobre el cuarto anterior), en %. Indica la inflación que espera la Fed.
  SPY: SPDR S&P 500 ETF Trust, el ETF más negociado sobre el S&P 500, en dólares (NYSE Arca, diario). Sirve de referencia de la bolsa de EE. UU. en las carteras.
  TLT: iShares 20+ Year Treasury Bond ETF, bonos del Tesoro de EE. UU. a más de 20 años, en dólares (diario). Es la forma habitual de exponerse a los tipos largos de EE. UU. en una cartera.
  GLD: SPDR Gold Shares, ETF respaldado por oro físico, en dólares (NYSE Arca, diario). Da exposición al oro en una cartera.
  ^VIX: Índice VIX de Cboe como precio diario (apertura, máximo, mínimo y cierre), en puntos. Complementa a la serie fred:VIXCLS cuando se necesita la vela del día.
  cb:BTC-USD: Bitcoin en dólares en Coinbase, vela diaria UTC visible al día siguiente. Es el criptoactivo de referencia.

# --- Búsqueda -------------------------------------------------------------------------------------------------
busqueda:
  pesos:
    exacto_total: 100        # el texto entero es el id o un alias
    id_alias: 10             # un término es el id (con o sin prefijo de fuente) o un alias
    nombre: 8
    palabras_clave: 5        # también los trozos del id
    descripcion: 3
    tema: 2                  # tema y subtema
    sinonimo: 0.9            # factor de un término que llega por sinónimo
    clave: 2                 # suma de las series con descripción a mano (si casan todos los términos)
    secundaria: -0.5         # suma de las de rol historia_previa o validación (si ya puntúan)
  vacias: [de, del, la, las, el, los, en, y, e, o, u, a, al, por, para, con, sin, un, una, unos, unas, que, se, su,
           sus, lo, the, of, and, in, 'on', to, for]   # 'on' entre comillas: YAML lo leería como true
  # Sinónimos (dirigidos): si la búsqueda contiene la clave, también se buscan sus equivalentes.
  sinonimos:
    2s10s: [t10y2y, 10y 2y, pendiente]
    pmi: [encuesta manufacturera, indice de gestores de compras, ism, sentimiento economico, esi]
    sentimiento: [confianza, sentiment]
    sentimiento del consumidor: [confianza del consumidor, umcsent, consumer sentiment]
    bund: [bono aleman, alemania 10 anos, bundesbank, yc aaa]
    bono aleman: [bund, bundesbank]
    inflacion: [ipc, cpi, hicp, pce, precios, inflation]
    ipc: [cpi, hicp, inflacion, indice de precios de consumo]
    cpi: [ipc, inflacion]
    hicp: [ipc armonizado, inflacion]
    precios: [inflacion, ipc]
    subyacente: [core, sin alimentos ni energia, xef000]
    core: [subyacente]
    inflacion esperada: [expectativas de inflacion, inflacion implicita, breakeven, t10yie, t5yifr]
    breakeven: [inflacion implicita]
