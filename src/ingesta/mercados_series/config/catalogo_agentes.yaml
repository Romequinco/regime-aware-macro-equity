# Catálogo para los agentes y búsqueda de series (Tema 1, Fase 2): lo lee catalogo_agentes.py.
#
# Lo ÚNICO que se escribe a mano del catálogo de los agentes está aquí; el resto sale de la base curada, del
# manifiesto, de catalogo_series.yaml, lista_curada.yaml, universo.yaml y las tablas del tema. Solo metadatos.
# Regenerar el CSV tras cambiar este fichero: python -m ingesta.mercados_series catalogo-agentes
#
# Reglas (temas, zonas, agentes): cada regla lleva 'si' con condiciones sobre los campos de la fila
#   (id, tipo, fuente, grupo, nombre, unidad, clase, bucket, mercado, rol, tema, subtema, clave) y TODAS deben
#   cumplirse. Una condición es un texto (igualdad), una lista (pertenencia) o un texto que empieza por '~'
#   (expresión regular de Python, sin distinguir mayúsculas, con re.search). 'clave' es true en las filas con
#   descripción a mano (abajo). Sin 'si', la regla vale para todas.
# - temas: la PRIMERA regla que cumple fija tema y subtema. Una fila sin tema es un error al construir.
# - zonas: la PRIMERA regla que cumple y da una zona. Valores especiales: '$pais' (país o zona de la serie según
#   su id y su fuente, inventario.pais_zona, traducido con zona_codigos), '$pareja' (tipo de cambio: la divisa
#   distinta del USD si el USD está en la pareja; si no, la distinta del EUR; código ISO de país = 2 primeras
#   letras de la divisa, EUR -> EA) y '$mercado' (zona_mercado). Si da vacío, se sigue con la siguiente regla.
# - agentes: se suman los de TODAS las reglas que cumplen (una fila puede tener varios). Sin agentes: error.

version: 1

agentes: [macro, risk, equity, portfolio, cio]

# Vocabulario cerrado de temas (con su uso, para la plantilla de descripción).
temas:
  tipos_interes: Sirve para seguir la política monetaria y el coste del dinero a corto plazo.
  curva: Sirve para leer la curva de tipos (su nivel, su pendiente y lo que descuenta el mercado).
  inflacion: Sirve para seguir la inflación y anticipar la política monetaria.
  actividad: Sirve para seguir el ciclo económico y el crecimiento.
  empleo: Sirve para seguir el mercado laboral.
  credito_spreads: Sirve para medir el riesgo de crédito y las condiciones de financiación.
  volatilidad: Sirve para medir la incertidumbre y el riesgo de mercado.
  condiciones_financieras: Sirve para medir de un vistazo el estrés y las condiciones financieras.
  renta_variable: Sirve para seguir la bolsa y la rentabilidad de la renta variable.
  renta_fija: Sirve para seguir la renta fija y construir la parte de bonos de una cartera.
  factores: Sirve para analizar estilos y factores de la bolsa (mercado, tamaño, valor, momentum, sectores).
  valoracion: Sirve para valorar la bolsa (cara o barata) frente a sus beneficios, dividendos o fundamentales.
  divisas: Sirve para seguir los tipos de cambio y la fuerza de cada divisa.
  materias_primas: Sirve para seguir los precios de las materias primas.
  monetario: Sirve para seguir la cantidad de dinero y el balance del banco central.
  sector_exterior: Sirve para seguir el comercio exterior y la balanza de pagos.
  vivienda: Sirve para seguir el mercado de la vivienda.
  fiscal: Sirve para seguir las cuentas públicas.
  cripto: Sirve para seguir los criptoactivos.

# --- Temas ----------------------------------------------------------------------------------------------------
temas_reglas:
  # Factores y carteras de Ken French
  - {si: {id: '~^ff:F3D\.RF$'}, tema: tipos_interes, subtema: libre_riesgo}
  - {si: {id: '~^ff:IND'}, tema: factores, subtema: sectores}
  - {si: {id: '~^ff:'}, tema: factores, subtema: fama_french}
  # Volatilidad (series y precios)
  - {si: {id: '~^(yf:)?\^MOVE$|^fred:VXTYN$'}, tema: volatilidad, subtema: tipos}
  - {si: {id: '~^fred:(EVZCLS|GVZCLS|OVXCLS)$'}, tema: volatilidad, subtema: otros_activos}
  - {si: {id: '~^(yf:)?\^SKEW$'}, tema: volatilidad, subtema: riesgo_de_cola}
  - {si: {id: '~^deriv:VOLREAL|^gw:M\.svar$'}, tema: volatilidad, subtema: realizada}
  - {si: {id: '~VIX|^fred:(VXNCLS|VXDCLS|VXEEMCLS|VXEWZCLS|RVXCLS)$|^\^VXN$'}, tema: volatilidad, subtema: renta_variable}
  - {si: {bucket: volatilidad}, tema: volatilidad, subtema: renta_variable}
  - {si: {bucket: volatilidad_tipos}, tema: volatilidad, subtema: tipos}
  # Condiciones financieras y estrés
  - {si: {id: '~^ofr:|^fred:(NFCI|ANFCI|NFCICREDIT|NFCILEVERAGE|NFCIRISK|STLFSI4|KCFSI|CFSI)$'}, tema: condiciones_financieras, subtema: estres}
  # Crédito y diferenciales
  - {si: {id: '~^fred:BAML(H|C0A0CMEY$|C0A0CM$|C0A1|C0A4)'}, tema: credito_spreads, subtema: corporativo}
  - {si: {id: '~^fred:(AAA|BAA|DAAA|DBAA|BAAFFM)$|^deriv:DBAA|^gw:M\.corpr$'}, tema: credito_spreads, subtema: corporativo}
  - {si: {id: '~^fred:(TEDRATE|DED3|DCPF3M|LIOR3M)$|^deriv:DCPF3M'}, tema: credito_spreads, subtema: financiacion}
  - {si: {id: '~^bis:WS_(CREDIT_GAP|DSR)\.'}, tema: credito_spreads, subtema: credito_privado}
  - {si: {id: '~^fred:(DRALACBS|DRCCLACBS|DRSFRMACBS|CORCCACBS)$'}, tema: credito_spreads, subtema: morosidad}
  - {si: {id: '~^fred:(BUSLOANS|CONSUMER|REALLN|TOTBKCR|TOTLL|TOTALSL|REVOLSL|BCNSDODNS|CMDEBT|TDSP)$'}, tema: credito_spreads, subtema: credito_bancario}
  # Monetario
  - {si: {id: '~^fred:(BOGMBASE|M2SL|WALCL|DPSACBW027SBOG)$'}, tema: monetario, subtema: dinero_y_balance}
  # Fiscal
  - {si: {id: '~^fred:(GFDEBTN|MTSDS133FMS)$'}, tema: fiscal, subtema: deuda_y_deficit}
  # Tipos oficiales de fuentes que también publican curva (antes de la regla de curva por prefijo)
  - {si: {id: '~^rba:FIRMMCRTD$|^boc:V39079$'}, tema: tipos_interes, subtema: oficial}
  # Curva soberana (rendimientos por plazo y pendientes)
  - {si: {id: '~^fred:(T10Y2Y|T10Y3M)$|^deriv:DGS(10|5)-DFF$'}, tema: curva, subtema: pendiente}
  - {si: {id: '~^fred:DFII'}, tema: curva, subtema: real}
  - {si: {id: '~^fred:(DGS\d+|DGS\d+MO|GS\d+)$|^ust:|^(yf:)?\^(TNX|TYX|FVX)$|^shiller:LONGRATE$|^gw:M\.(lty|ltr)$'}, tema: curva, subtema: soberana}
  - {si: {id: '~^(boe|mof|boc|bbk|rba):|^ecb:YC\.'}, tema: curva, subtema: soberana}
  - {si: {fuente: [boe_curvas, mof_jgb, boc_curva, bce_curvas, ust_curva, bundesbank]}, tema: curva, subtema: soberana}
  # Tipos de interés a corto (oficiales, interbancarios y letras)
  - {si: {id: '~^fred:(FEDFUNDS|DFF|EFFR|IORB|DPCREDIT|FEDTARMD)$|^ecb:(DFR|MRO)$|^bis:WS_CBPOL\.'}, tema: tipos_interes, subtema: oficial}
  - {si: {id: '~^fred:(SOFR|OBFR)$|^ecb:(ESTR|EONIA)$|^boj:|^deriv:SOFR-EFFR$'}, tema: tipos_interes, subtema: interbancario}
  - {si: {id: '~^fred:(DTB\w+|TB3MS|TB3SMFFM)$|^(yf:)?\^IRX$|^gw:M\.(tbl|Rfree)$'}, tema: tipos_interes, subtema: letras}
  # Divisas
  - {si: {id: '~^ecb:EXR\.|^fred:DEX'}, tema: divisas, subtema: bilateral}
  - {si: {id: '~^fred:(DTWEXBGS|DTWEXAFEGS|TWEXAFEGSMTH|NNUSBIS|RNUSBIS)$|^bis:WS_EER\.|^(yf:)?DX-Y\.NYB$|^UUP$'}, tema: divisas, subtema: efectivo}
  - {si: {bucket: divisas}, tema: divisas, subtema: bilateral}
  # Inflación (antes que actividad: hay series de precios en grupos de encuestas)
  - {si: {id: '~^fred:(T10YIE|T5YIE|T5YIFR|EXPINF\w+|MICH)$'}, tema: inflacion, subtema: expectativas}
  - {si: {id: '~^fred:(CPILFESL|PCEPILFE|CORESTICK\w+|MEDCPI\w+|TRMMEAN\w+|PCETRIM\w+|CUSR0000SACL1E|CUSR0000SASLE)$|XEF000'}, tema: inflacion, subtema: subyacente}
  - {si: {id: '~^fred:(PCEPI|PCECTPIMD)$'}, tema: inflacion, subtema: pce}
  - {si: {id: '~^fred:(PPI\w+|WPU\w+|WPSFD\w+)$'}, tema: inflacion, subtema: produccion}
  - {si: {id: '~^fred:(IQ|IR)$'}, tema: inflacion, subtema: comercio_exterior}
  - {si: {id: '~^fred:GDPDEF$'}, tema: inflacion, subtema: deflactor}
  - {si: {id: '~^fred:(CPI|CUSR)|^ecb:HICP\.|^eurostat:HICP|^oecd:CP\.|FP\.CPI|^gw:M\.infl$|^shiller:CPI$'}, tema: inflacion, subtema: ipc}
  - {si: {grupo: precios}, tema: inflacion, subtema: ipc}
  # Materias primas
  - {si: {id: '~^fred:WTISPLC$|^(yf:)?(GC=F|\^BCOM|\^SPGSCI)$'}, tema: materias_primas, subtema: precios}
  - {si: {bucket: oro}, tema: materias_primas, subtema: oro}
  - {si: {bucket: metales_preciosos}, tema: materias_primas, subtema: metales_preciosos}
  - {si: {bucket: metales_industriales}, tema: materias_primas, subtema: metales_industriales}
  - {si: {bucket: energia}, tema: materias_primas, subtema: energia}
  - {si: {bucket: materias_primas}, tema: materias_primas, subtema: amplio}
  # Valoración y beneficios
  - {si: {id: '~^shiller:(CAPE|E|D)$|^gw:M\.(bm|ntis)$|^fred:NCBEILQ027S$'}, tema: valoracion, subtema: bolsa}
  - {si: {id: '~^fred:(CP|CPATAX)$'}, tema: valoracion, subtema: beneficios}
  # Renta variable (series de índices y de rentabilidad)
  - {si: {id: '~^shiller:P$|^gw:M\.(Index|CRSP_SPvw|CRSP_SPvwx)$'}, tema: renta_variable, subtema: indices}
  - {si: {tipo: serie, fuente: yfinance}, tema: renta_variable, subtema: indices}
  # Empleo
  - {si: {id: '~^fred:(ICSA|CCSA)$'}, tema: empleo, subtema: peticiones_subsidio}
  - {si: {id: '~^fred:(UNRATE|U6RATE|NROU|UEMP27OV|UNRATEMD)$|UNEMP|une_rt|UNEHRT|SL\.UEM'}, tema: empleo, subtema: paro}
  - {si: {id: '~^fred:JTS'}, tema: empleo, subtema: vacantes_y_rotacion}
  - {si: {id: '~^fred:(AHETPI|CES0500000003|ECIALLCIV|ULCNFB)$'}, tema: empleo, subtema: salarios}
  - {si: {id: '~^fred:(PAYEMS|USPRIV|MANEMP|USCONS|TEMPHELPS|CE16OV|CLF16OV)$'}, tema: empleo, subtema: empleo}
  - {si: {grupo: empleo}, tema: empleo, subtema: otros}
  # Vivienda, sector exterior
  - {si: {grupo: vivienda}, tema: vivienda, subtema: vivienda}
  - {si: {grupo: comercio}, tema: sector_exterior, subtema: comercio}
  - {si: {id: '~^fred:NETEXC$'}, tema: sector_exterior, subtema: comercio}
  # Actividad
  - {si: {grupo: recesion}, tema: actividad, subtema: recesion}
  - {si: {id: '~^fred:USRECD$'}, tema: actividad, subtema: recesion}
  - {si: {id: '~BS-ESI|^fred:UMCSENT$'}, tema: actividad, subtema: encuestas}
  - {si: {grupo: encuestas}, tema: actividad, subtema: encuestas}
  - {si: {id: '~^oecd:LI_|^fred:(USALOLITOAASTSAM|BBKMLEIX|CFNAI|CFNAIMA3|USPHCI|WEI)$'}, tema: actividad, subtema: indicadores_ciclicos}
  - {si: {id: '~namq_10_gdp|^ecb:MNA\.|NY\.GDP|^fred:(GDPNOW|BBKMGDP)$'}, tema: actividad, subtema: pib}
  - {si: {grupo: pib}, tema: actividad, subtema: pib}
  - {si: {grupo: consumo}, tema: actividad, subtema: consumo}
  - {si: {id: '~^fred:TNWBSHNO$'}, tema: actividad, subtema: hogares}
  - {si: {grupo: actividad}, tema: actividad, subtema: produccion_y_pedidos}
  # Precios: renta fija, renta variable, cripto (por bucket de universo.yaml o, si no hay, por id)
  - {si: {bucket: liquidez_usd}, tema: renta_fija, subtema: liquidez}
  - {si: {bucket: [rf_credito_ig, rf_credito_hy]}, tema: renta_fija, subtema: credito}
  - {si: {bucket: rf_ligada_inflacion}, tema: renta_fija, subtema: ligada_inflacion}
  - {si: {bucket: rf_emergentes}, tema: renta_fija, subtema: emergentes}
  - {si: {bucket: '~^rf_gobierno'}, tema: renta_fija, subtema: gobierno}
  - {si: {bucket: '~^rf_'}, tema: renta_fija, subtema: agregado}
  - {si: {bucket: cripto}, tema: cripto, subtema: cripto}
  - {si: {bucket: '~^factor_'}, tema: renta_variable, subtema: factor}
  - {si: {id: '~^(SPHB|SPLV)$'}, tema: renta_variable, subtema: factor}
  - {si: {bucket: sector_eeuu}, tema: renta_variable, subtema: sectorial}
  - {si: {bucket: inmobiliario}, tema: renta_variable, subtema: inmobiliario}
  - {si: {tipo: precio, clase: accion}, tema: renta_variable, subtema: acciones}
  - {si: {tipo: precio, clase: indice}, tema: renta_variable, subtema: indices}
  - {si: {bucket: '~^rv_'}, tema: renta_variable, subtema: regional}
  - {si: {id: '~^MDY$'}, tema: renta_variable, subtema: regional}

# --- Zonas ----------------------------------------------------------------------------------------------------
# Códigos: ISO-2 de país (US, GB, JP, CN, CA, DE, FR, IT, AU, KR, HK, IN, ES, NL, CH, TW, BR...) y agregados:
# EA zona euro, EU Unión Europea o Europa en sentido amplio, EM emergentes, APAC Asia-Pacífico, WLD mundo.
zona_codigos:
  USA: US
  EA: EA
  EA20: EA
  EA21: EA
  XM: EA
  EMU: EA
  U2: EA
  EU27_2020: EU
  G4E: EU
  UK: GB
  GBR: GB
  DEU: DE
  FRA: FR
  ITA: IT
  JPN: JP
  CHN: CN
  CAN: CA
  AUS: AU
  LMY: EM
  WLD: WLD

zona_nombres:
  US: [estados unidos, eeuu, ee uu, usa, united states, americano]
  EA: [zona euro, eurozona, euro area, eurozone, area del euro]
  EU: [europa, union europea, ue, europe]
  GB: [reino unido, uk, united kingdom, britanico]
  JP: [japon, japan, japones]
  CN: [china, chino]
  CA: [canada]
  DE: [alemania, germany, aleman]
  FR: [francia, france]
  IT: [italia, italy]
  AU: [australia]
  KR: [corea del sur, korea]
  HK: [hong kong]
  IN: [india]
  ES: [espana, spain]
  NL: [paises bajos, holanda, netherlands]
  CH: [suiza, switzerland]
  TW: [taiwan]
  BR: [brasil, brazil]
  MX: [mexico]
  ZA: [sudafrica, south africa]
  EM: [emergentes, emerging markets]
  APAC: [asia pacifico, asia]
  WLD: [mundo, global, mundial, world]

zona_mercado:
  XNYS: US
  XNAS: US
  ARCX: US
  CBOE_IDX: US
  ICE_MOVE: US
  ICE_DXY: US
  NAV_US: US
  XKRX: KR
  XLON: GB
  XHKG: HK
  XNSE: IN
  XETR: DE
  XMIL: IT
  XPAR: FR
  XMAD: ES
  XAMS: NL
  XSWX: CH
  XTKS: JP
  XTAI: TW
  STOXX_IDX: EU
  XSHG: CN
  XASX: AU
  BVMF: BR
  XTSE: CA
  CRYPTO: WLD

zonas:
  # Excepciones por id
  - {si: {id: '~^(yf:)?\^W5000$'}, zona: US}          # Yahoo lo da en XLON (saneado P21)
  - {si: {id: '~^6E=F$'}, zona: EA}
  - {si: {id: '~^AUDUSD=X$'}, zona: AU}
  - {si: {id: '~^CAD=X$'}, zona: CA}
  - {si: {id: '~^CHF=X$'}, zona: CH}
  - {si: {id: '~^GBPUSD=X$'}, zona: GB}
  - {si: {id: '~^(VNQI|IWDP\.L|CPXJ\.L)$'}, zona: WLD}
  - {si: {id: '~^(IUSP\.L|VNQ)$'}, zona: US}
  - {si: {id: '~^deriv:VOLREAL'}, zona: US}
  # Tipos de cambio bilaterales: la divisa que no es el dólar (o el euro)
  - {si: {tema: divisas, subtema: bilateral, tipo: serie}, zona: $pareja}
  # Series: país del id o de la fuente
  - {si: {tipo: [serie, proyeccion]}, zona: $pais}
  - {si: {tipo: serie, fuente: yfinance, tema: materias_primas}, zona: WLD}
  - {si: {tipo: serie, fuente: yfinance}, zona: US}
  # Precios: acciones, índices y volatilidad por mercado; ETF de un país por su nombre; el resto por bucket
  - {si: {tipo: precio, tema: materias_primas}, zona: WLD}
  - {si: {tipo: precio, clase: [accion, indice, volatilidad]}, zona: $mercado}
  - {si: {tipo: precio, clase: [etf, etp], nombre: '~(?<!ex-)(?<!ex )Japan'}, zona: JP}
  - {si: {tipo: precio, clase: [etf, etp], nombre: '~Germany'}, zona: DE}
  - {si: {tipo: precio, clase: [etf, etp], nombre: '~United Kingdom|\bUK\b'}, zona: GB}
  - {si: {tipo: precio, clase: [etf, etp], nombre: '~France'}, zona: FR}
  - {si: {tipo: precio, clase: [etf, etp], nombre: '~Italy'}, zona: IT}
  - {si: {tipo: precio, clase: [etf, etp], nombre: '~Canada'}, zona: CA}
  - {si: {tipo: precio, clase: [etf, etp], nombre: '~Spain'}, zona: ES}
  - {si: {tipo: precio, clase: [etf, etp], nombre: '~Taiwan'}, zona: TW}
  - {si: {tipo: precio, clase: [etf, etp], nombre: '~Mexico'}, zona: MX}
  - {si: {tipo: precio, clase: [etf, etp], nombre: '~Korea'}, zona: KR}
  - {si: {tipo: precio, clase: [etf, etp], nombre: '~Brazil'}, zona: BR}
  - {si: {tipo: precio, clase: [etf, etp], nombre: '~South Africa'}, zona: ZA}
  - {si: {tipo: precio, clase: [etf, etp], nombre: '~India'}, zona: IN}
  - {si: {tipo: precio, clase: [etf, etp], nombre: '~Australia'}, zona: AU}
  - {si: {tipo: precio, clase: [etf, etp], nombre: '~Hong Kong'}, zona: HK}
  - {si: {bucket: '~desarrollados'}, zona: WLD}
  - {si: {bucket: '~eeuu$|^rf_municipal$|^rf_titulizaciones$|^rf_credito_|^rf_ligada_inflacion$|^liquidez_usd$|^volatilidad'}, zona: US}
  - {si: {bucket: rv_europa}, zona: EU}
  - {si: {bucket: rv_japon}, zona: JP}
  - {si: {bucket: rv_china}, zona: CN}
  - {si: {bucket: '~emergentes$'}, zona: EM}
  - {si: {bucket: rv_asia_pacifico}, zona: APAC}
  - {si: {bucket: '~global$|^oro$|^metales_|^energia$|^materias_primas$|^cripto$|^inmobiliario$'}, zona: WLD}
  - {si: {bucket: divisas}, zona: US}
  - {si: {tipo: precio}, zona: $mercado}

# --- Agentes --------------------------------------------------------------------------------------------------
agentes_reglas:
  # macro: tipos, inflación, actividad, empleo, monetario, sector exterior (y vivienda, fiscal, materias primas)
  - {si: {tema: [tipos_interes, inflacion, actividad, empleo, monetario, sector_exterior, vivienda, fiscal, materias_primas]}, agentes: [macro]}
  - {si: {tema: divisas, tipo: serie}, agentes: [macro]}   # índices del dólar y bilaterales (EURUSD, USDJPY...)
  - {si: {tema: credito_spreads, subtema: [credito_bancario, credito_privado, morosidad]}, agentes: [macro]}
  - {si: {tema: valoracion, subtema: beneficios}, agentes: [macro]}
  - {si: {tema: curva, tipo: serie}, agentes: [macro]}
  # risk: volatilidad, crédito, condiciones financieras, curva (y cripto, bonos con riesgo de crédito)
  - {si: {tema: [volatilidad, credito_spreads, condiciones_financieras, curva, cripto]}, agentes: [risk]}
  - {si: {tema: renta_fija, subtema: [credito, emergentes]}, agentes: [risk]}
  # equity: renta variable, factores, valoración y precios de acciones
  - {si: {tema: [renta_variable, factores, valoracion]}, agentes: [equity]}
  - {si: {tipo: precio, clase: accion}, agentes: [equity]}
  # portfolio: precios de ETF, índices y fondos; divisas; tipos cortos; renta fija; cripto; materias primas
  - {si: {tipo: precio, clase: [etf, etp, indice, fondo, futuro, divisa, cripto, volatilidad]}, agentes: [portfolio]}
  - {si: {tema: [divisas, renta_fija, cripto]}, agentes: [portfolio]}
  - {si: {tema: tipos_interes, subtema: [oficial, interbancario, letras, libre_riesgo]}, agentes: [portfolio]}
  # cio: visión de conjunto (estrés, recesión, pendiente de la curva, proyecciones de la Fed y series clave)
  - {si: {tema: condiciones_financieras}, agentes: [cio]}
  - {si: {tema: actividad, subtema: [recesion, indicadores_ciclicos]}, agentes: [cio]}
  - {si: {tema: curva, subtema: pendiente}, agentes: [cio]}
  - {si: {tipo: proyeccion}, agentes: [cio]}
  - {si: {clave: true}, agentes: [cio]}

# --- Avisos a mano ----------------------------------------------------------------------------------------------
# Series que la curada solo deja ver tarde (primera publicación de 2016 en adelante) y que no tienen una historia
# previa en lista_curada.yaml: qué usar para fechas anteriores. Se suman a los avisos de TODAS las reglas que
# cumplen; si nombran un id del catálogo publicado después que la fila, llevan su etiqueta de visibilidad.
# (Las que sí tienen historia previa ya lo dicen: «su historia anterior está en ...».)
avisos_reglas:
  - {si: {id: '~^fred:BAML'}, aviso: 'FRED solo da los 3 últimos años de ICE BofA (se ve desde 2023-10-12): para la historia larga del crédito, deriv:DBAA-DGS10, deriv:DBAA-DAAA o los ETF HYG, JNK y LQD'}
  - {si: {id: '~^ofr:FSI'}, aviso: 'publicada desde 2017-10-25: antes, fred:KCFSI o fred:CFSI'}
  - {si: {id: '~^fred:STLFSI4$'}, aviso: 'versión 4 publicada desde 2022-11-10: antes, fred:KCFSI, fred:CFSI o fred:NFCI'}
  - {si: {id: '~^fred:(SOFR|OBFR)$|^deriv:SOFR-EFFR$'}, aviso: 'antes de su primera publicación, el tipo a un día en dólares es fred:EFFR (o fred:DFF)'}
  - {si: {id: '~^fred:IORB$'}, aviso: 'antes de 2021-07-29 la Fed remuneraba las reservas con IOER (no está en la base): fred:EFFR o fred:DFF'}
  - {si: {id: '~^fred:SAHM'}, aviso: 'reconstruida desde 2019: para fechas anteriores, calcularla con fred:UNRATE'}
  - {si: {id: '~^eurostat:ei_bssi_m_r2\.M\.BS-ESI-I\.SA\.EA2[01]$'}, aviso: 'el ESI de la zona euro solo se ve desde 2023: antes, eurostat:ei_bssi_m_r2.M.BS-ESI-I.SA.EU27_2020 o los de DE, FR e IT'}
  - {si: {id: '~^ecb:HICP\.M\.U2\.N\.XEF000'}, aviso: 'sin historia previa en la base: antes de 2026-01-28 no hay inflación subyacente de la zona euro (solo la general, eurostat:HICP_EMP.EA)'}
  - {si: {id: '~^ust:PAR\.(6W|2M|4M)$'}, aviso: 'plazo nuevo del Tesoro: antes, fred:DTB3 o fred:DGS1MO'}

